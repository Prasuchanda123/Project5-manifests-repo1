#Argo CD Application manifest for NodeJS shopping cart application.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nodejs-shopping-cart
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://Prasu2203@dev.azure.com/Prasu2203/Project5/_git/Project5-Manifests-repo.git
    targetRevision: main
    path: helm/nodejs-shopping-cart
    helm:
    valueFiles:
      - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: nodejs-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
